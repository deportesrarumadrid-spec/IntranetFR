{% extends 'dashboard.html' %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>
    .mi-equipo-layout { display: flex; flex-direction: column; gap: 25px; }
    .card-modern { background: white; border-radius: 24px; padding: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; position: relative; }
    .card-title { font-weight: 900; color: #1e293b; text-transform: uppercase; letter-spacing: 1px; font-size: 1.2rem; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
    .card-title i { color: #E31E24; }

    /* Main grid for chart + monthly rankings and overall ranking */
    .main-stats-grid {
        display: grid;
        grid-template-columns: 1.8fr 1.1fr 1.4fr 1fr; /* Evolución al doble de ancho, resto fluido */
        gap: 8px;
        align-items: stretch;
    }

    /* Altura igual para todos los bloques */
    .main-stats-grid .card-modern { 
        height: 600px; 
        display: flex; 
        flex-direction: column; 
    }

    .player-rank-item {
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        margin-top: 5px;
        white-space: nowrap; /* Prevent wrapping */
    }
    .player-rank-item.top { color: #15803d; }
    .player-rank-item.bottom { color: #b91c1c; }
    .player-rank-icon { font-size: 8px; }
    .player-rank-name { overflow: hidden; text-overflow: ellipsis; max-width: 90px; } /* Prevent long names from breaking layout */
    .player-rank-perc { font-size: 15px; font-weight: 900; }

    /* Color classes for consistency */
    .text-green-subtle { color: #15803d; } /* Consistent green (darker) */
    .text-red-subtle { color: #ef4444; }   /* Consistent red */
    .text-dark-gray { color: #475569; }    /* Default player name color */
    .text-dark-blue { color: #1e293b; }    /* Default percentage color */

    /* Full Ranking List (Asistencias Plantilla) */
    .full-ranking-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .full-ranking-item {
        display: flex;
        align-items: center;
        padding: 8px 15px; /* Increased padding for a finer look */
        border-radius: 12px;
        background: #fdfdfd;
        border: 1px solid #f1f5f9;
        transition: all 0.2s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.03); /* Subtle shadow */
    }
    .full-ranking-item:hover {
        border-color: #E31E24;
        box-shadow: 0 4px 12px rgba(227, 30, 36, 0.08);
    }
    .full-ranking-pos {
        font-weight: 800; /* Bolder position */
        font-size: 13px; /* Slightly larger */
        color: #94a3b8;
        min-width: 28px; /* Adjusted width */
        text-align: center;
    }
    .full-ranking-name {
        flex: 1;
        font-weight: 600; /* Finer name */
        font-size: 14px;
        color: #1e293b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-left: 10px; /* More space */
    }
    .full-ranking-stats {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px; /* Smaller stats */
        font-weight: 500; /* Finer stats */
        color: #64748b; /* Lighter color for subtlety */
        min-width: 80px; /* Ensure enough space */
        justify-content: flex-end;
    }
    .full-ranking-perc {
        font-weight: 800; /* Bolder percentage */
        font-size: 16px; /* Slightly larger percentage */
        min-width: 55px; /* Adjusted width */
        text-align: right;
        margin-left: 10px; /* Space from stats */
    }
    .full-ranking-item.top-player {
        background: #dcfce7;
        border-color: #bbf7d0;
    }
    .full-ranking-item.top-player .full-ranking-name,
    .full-ranking-item.top-player .full-ranking-perc,
    .full-ranking-item.top-player .full-ranking-stats {
        color: #15803d;
    }
    .full-ranking-item.bottom-player {
        background: #fee2e2;
        border-color: #fecdd3;
    }
    .full-ranking-item.bottom-player .full-ranking-name,
    .full-ranking-item.bottom-player .full-ranking-perc,
    .full-ranking-item.bottom-player .full-ranking-stats {
        color: #b91c1c;
    }

    /* Estilos Modernos para Asistencias */
    .month-rank-box.prominent { 
        margin-bottom: 15px; 
        padding: 12px; 
        background: #f8fafc; 
        border-radius: 16px; 
        border: 1px solid #f1f5f9; 
    }
    .month-rank-title { font-size: 14px; font-weight: 900; color: #1e293b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
    
    .rank-mini-item {
        display: flex; align-items: center; gap: 8px; font-size: 14px; 
        font-weight: 500; margin-bottom: 4px; /* Más fino */
    }
    .rank-mini-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-mini-perc { font-weight: 700; min-width: 45px; text-align: right; }
    
    .history-grid-title {
        font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; /* Reduced margin-top */
        letter-spacing: 1px; margin: 10px 0 10px 0; text-align: center; /* Reduced margin-top */
    }
    .history-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .history-item { background: #fff; border: 1px solid #f1f5f9; border-radius: 10px; padding: 6px 4px; text-align: center; }
    .history-month-name { font-size: 9px; font-weight: 900; color: #1e293b; margin-bottom: 4px; text-transform: uppercase; }
    .history-values {
        display: flex;
        flex-direction: column;
        font-size: 10px;
        font-weight: 500; /* Más fino */
        gap: 2px;
        text-align: left; /* Align content of history-values to the left */
        padding-left: 4px; /* Small padding for visual balance */
    }
    .history-val {
        display: flex;
        align-items: center;
        gap: 2px;
        justify-content: space-between; /* Distribute name and percentage */
    }
    .history-player-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-player-perc { font-weight: 700; min-width: 35px; text-align: right; }
    
    .scroll-v { overflow-y: auto; padding-right: 5px; }
    .scroll-v::-webkit-scrollbar { width: 4px; }
    .scroll-v::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

    /* Tooltip Profesional */
    [title] { position: relative; }
    .custom-tooltip { cursor: help; border-bottom: 1px dashed #ccc; }
    
    /* Compactar columnas de rendimiento */
    .col-compact { width: 60px; text-align: center; }

    /* Ranking Table (Rendimiento) */
    .table-val { width: 100%; border-collapse: collapse; }
    .table-val th { text-align: left; font-size: 12px; color: #94a3b8; padding: 10px; text-transform: uppercase; }
    .table-val td { padding: 10px 4px; font-size: 16px; font-weight: 700; border-bottom: 1px solid #f8fafc; text-align: center; }
    .table-val td:first-child { text-align: left; padding-left: 10px; font-weight: 600; }

    /* General Ranking Item Card (Old, not used for full ranking anymore) */
    .rank-item-card { display: none; } /* Hide old ranking item card if still present */

</style>

<div class="mi-equipo-layout">
    {% include 'analisis_plantilla_page.html' %}
    <div class="main-stats-grid">
        <!-- Bloque 1: Gráfico -->
        <div class="card-modern">
            <div class="card-title"><i class="fas fa-chart-line"></i> EVOLUCIÓN ASISTENCIA</div>
            <div style="flex: 1; min-height: 0;">
                <canvas id="chartAsistencia"></canvas>
            </div>
        </div>

        <!-- Bloque 2: Rankings Mensuales -->
        <div class="card-modern">
            <div class="card-title" style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                <span style="display: flex; gap: 6px;">
                    <i class="fas fa-arrow-up" style="color:#22c55e; font-size: 12px;"></i><i class="fas fa-arrow-down" style="color:#ef4444; font-size: 12px;"></i>
                </span>
                ASISTENCIAS
            </div>
            <div id="containerMonthlyRankings" class="scroll-v" style="flex: 1;"></div>
        </div>

        <!-- Bloque 3: Ranking Global (Multi-columna) -->
        <div class="card-modern">
            <div class="card-title" style="margin-bottom: 10px;">ASISTENCIAS PLANTILLA</div>
            <div class="scroll-v" style="flex: 1;">
                <div id="tbodyFullRanking" class="full-ranking-list"></div>
            </div>
        </div>

        <!-- Bloque 4: Rendimiento Flechas -->
        <div class="card-modern">
            <div class="card-title" style="margin-bottom: 10px;"><i class="fas fa-arrows-up-down"></i> RENDIMIENTO</div>
            <table class="table-val">
                <thead>
                    <tr>
                        <th>MES</th>
                        <th><i class="fas fa-arrow-up" style="color:#15803d"></i> ALTO</th>
                        <th><i class="fas fa-arrow-right" style="color:#f59e0b"></i> NORMAL</th>
                        <th><i class="fas fa-arrow-down" style="color:#ef4444"></i> BAJO</th>
                        <th style="text-align: center;">
                            <span style="display: flex; gap: 6px; justify-content: center;">
                                <i class="fas fa-arrow-up" style="color:#15803d; font-size: 12px;"></i><i class="fas fa-arrow-down" style="color:#ef4444; font-size: 12px;"></i>
                            </span>
                        </th>
                    </tr>
                </thead>
                <tbody id="tbodyValoracion"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let chartAsistencia = null;
    Chart.register(ChartDataLabels); // Register the datalabels plugin

    async function cargarStats() {
        const res = await fetch('/api/stats/mi-equipo');
        const data = await res.json();

        if (data.error) {
            console.error("Error en la API de estadísticas:", data.error);
            return;
        }

        allAsistenciaData = data.asistencia;
        renderChart(allAsistenciaData);
        renderValoracion(data.tabla_valoracion); // This function is still needed for the bottom-left card
        renderFullRanking(data.total_ranking); // New call
        renderMonthlyRankings(allAsistenciaData); // New call
    }

    function renderChart(asis) {
        const ctx = document.getElementById('chartAsistencia').getContext('2d');
        
        chartAsistencia = new Chart(ctx, {
            type: 'line',
            data: {
                labels: asis.labels,
                datasets: [
                    {
                        label: 'Media Asistencia %',
                        data: asis.media,
                        borderColor: '#E31E24',
                        backgroundColor: 'rgba(227, 30, 36, 0.05)',
                        borderWidth: 4,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#E31E24',
                        pointBorderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 9,
                        tension: 0.4,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false, // Removed legend as per request
                    },
                    datalabels: {
                        display: true,
                        align: 'top',
                        anchor: 'end',
                        offset: 5,
                        color: '#E31E24',
                        font: { weight: 'bold', size: 12 },
                        formatter: (val) => val + '%'
                    },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => asis.ratio[ctx.dataIndex]
                        }
                    }
                },
                scales: {
                    y: { beginAtZero: true, max: 100, ticks: { font: { weight: 'bold' } }, grid: { color: '#f1f5f9' } },
                    x: { grid: { display: false }, ticks: { font: { weight: 'bold' } } }
                } // Removed onClick handler as monthly ranking card is removed
            }
        });
    }

    function renderMonthlyRankings(asis) {
        const container = document.getElementById('containerMonthlyRankings');
        container.innerHTML = '';
        
        // Recopilar meses con datos y ordenarlos (más reciente primero)
        const validMonths = [];
        for (let i = 0; i < asis.labels.length; i++) {
            if (asis.monthly_player_rankings[i] && asis.monthly_player_rankings[i].length > 0) {
                validMonths.push({
                    label: asis.labels[i],
                    players: asis.monthly_player_rankings[i]
                });
            }
        }
        validMonths.reverse();

        if (validMonths.length === 0) return;

        // Separar destacados (2 últimos) del historial
        const prominent = validMonths.slice(0, 2);
        const history = validMonths.slice(2);

        let html = '';

        // 1. Renderizar meses destacados (Junio/Mayo)
        prominent.forEach(m => {
            const sorted = [...m.players].sort((a, b) => b.perc - a.perc);
            const top2 = sorted.slice(0, 2);
            const bottom2 = sorted.length > 2 ? sorted.slice(-2).reverse() : [];

            html += `
                <div class="month-rank-box prominent">
                    <div class="month-rank-title">${m.label}</div>
                    ${top2.map(p => `
                        <div class="rank-mini-item">
                            <i class="fas fa-arrow-up text-green-subtle" style="font-size: 10px;"></i>
                            <span class="rank-mini-name text-green-subtle">${p.nombre.split(' ')[0]}</span>
                            <span class="rank-mini-perc text-green-subtle">${p.perc}%</span>
                        </div>
                    `).join('')}
                    <div style="height: 4px;"></div>
                    ${bottom2.map(p => `
                        <div class="rank-mini-item">
                            <i class="fas fa-arrow-down text-red-subtle" style="font-size: 10px;"></i>
                            <span class="rank-mini-name text-red-subtle">${p.nombre.split(' ')[0]}</span>
                            <span class="rank-mini-perc text-red-subtle">${p.perc}%</span>
                        </div>
                    `).join('')}
                </div>
            `;
        });

        // 2. Renderizar historial en 4 columnas
        if (history.length > 0) {
            html += `<div class="history-grid-title">Meses Anteriores</div>`;
            html += `<div class="history-grid">`;
            history.forEach(m => {
                const sorted = [...m.players].sort((a, b) => b.perc - a.perc);
                
                let playersHtml = '';

                // Top 2 players
                if (sorted.length > 0) {
                    playersHtml += `
                        <div class="history-val">
                            <i class="fas fa-arrow-up text-green-subtle" style="font-size:7px"></i>
                            <span class="history-player-name text-green-subtle" title="${sorted[0].nombre}">${sorted[0].nombre.split(' ')[0]}</span>
                            <span class="history-player-perc text-green-subtle">${sorted[0].perc}%</span>
                        </div>`;
                }
                if (sorted.length > 1) {
                    playersHtml += `
                        <div class="history-val">
                            <i class="fas fa-arrow-up text-green-subtle" style="font-size:7px"></i>
                            <span class="history-player-name text-green-subtle" title="${sorted[1].nombre}">${sorted[1].nombre.split(' ')[0]}</span>
                            <span class="history-player-perc text-green-subtle">${sorted[1].perc}%</span>
                        </div>`;
                }

                // Add a separator if there are enough players to show distinct top and bottom
                if (sorted.length > 2) {
                    playersHtml += `<div style="height: 4px;"></div>`; // Small visual separator
                }

                // Bottom 2 players (only if they are distinct from the top 2)
                if (sorted.length > 2) { // If 3 or more players, we can show distinct top 2 and bottom 2
                    playersHtml += `
                        <div class="history-val">
                            <i class="fas fa-arrow-down text-red-subtle" style="font-size:7px"></i>
                            <span class="history-player-name text-red-subtle" title="${sorted[sorted.length - 2].nombre}">${sorted[sorted.length - 2].nombre.split(' ')[0]}</span>
                            <span class="history-player-perc text-red-subtle">${sorted[sorted.length - 2].perc}%</span>
                        </div>
                        <div class="history-val">
                            <i class="fas fa-arrow-down text-red-subtle" style="font-size:7px"></i>
                            <span class="history-player-name text-red-subtle" title="${sorted[sorted.length - 1].nombre}">${sorted[sorted.length - 1].nombre.split(' ')[0]}</span>
                            <span class="history-player-perc text-red-subtle">${sorted[sorted.length - 1].perc}%</span>
                        </div>`;
                } else if (sorted.length === 2) { // If exactly 2 players, the second player is also the worst
                    playersHtml += `
                        <div class="history-val">
                            <i class="fas fa-arrow-down text-red-subtle" style="font-size:7px"></i>
                            <span class="history-player-name text-red-subtle" title="${sorted[1].nombre}">${sorted[1].nombre.split(' ')[0]}</span>
                            <span class="history-player-perc text-red-subtle">${sorted[1].perc}%</span>
                        </div>`;
                }
                // If sorted.length is 1, only the top 1 is shown, no separate bottom section.

                html += `
                    <div class="history-item">
                        <div class="history-month-name">${m.label.split(' ')[0].substring(0,3)}</div>
                        <div class="history-values">
                            ${playersHtml}
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
        }

        container.innerHTML = html;
        container.scrollTop = 0;
    }

    function renderFullRanking(ranking) {
        const container = document.getElementById('tbodyFullRanking');
        container.innerHTML = ranking.map((p, i) => {
            let itemClass = '';
            if (i < 3) {
                itemClass = 'top-player';
            } else if (i >= ranking.length - 3) {
                itemClass = 'bottom-player';
            }
            return `
                <div class="full-ranking-item ${itemClass}">
                    <span class="full-ranking-pos">${i+1}</span>
                    <span class="full-ranking-name" title="${p.nombre}">${p.nombre.split(' ')[0]}</span>
                    <span class="full-ranking-stats">
                        ${p.si_count} SI / ${p.total_available_days}
                    </span>
                    <span class="full-ranking-perc">${p.perc}%</span>
                </div>
            `;
        }).join('');
    }

    function renderValoracion(tabla_valoracion) {
        const tbody = document.getElementById('tbodyValoracion');
        tbody.innerHTML = '';
        if (tabla_valoracion && tabla_valoracion.length > 0) {
            tabla_valoracion.forEach(row => {
                tbody.innerHTML += `
                    <tr>
                        <td>${row.mes}</td>
                        <td class="cell-perc" style="color:#15803d;" title="${row.n_arriba} flechas">${row.arriba}%</td>
                        <td class="cell-perc" style="color:#f59e0b;" title="${row.n_medio} flechas">${row.medio}%</td>
                        <td class="cell-perc" style="color:#ef4444;" title="${row.n_abajo} flechas">${row.abajo}%</td>
                        <td class="charlas-col">${row.charlas}</td>
                    </tr>
                `;
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px; color: #999;">No hay datos de valoración.</td></tr>';
        }
    }

    window.addEventListener('load', function() {
        cargarStats();
    });
</script>
{% endblock %}
