{% extends 'dashboard.html' %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>
    .mi-equipo-layout { display: flex; flex-direction: column; gap: 25px; }
    .card-modern { background: white; border-radius: 24px; padding: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; position: relative; }
    .card-title { font-weight: 900; color: #1e293b; text-transform: uppercase; letter-spacing: 1px; font-size: 1.2rem; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
    .card-title i { color: #E31E24; }

    /* Main grid for chart + monthly rankings and overall ranking */
    .main-stats-grid {
        display: grid;
        grid-template-columns: 1.8fr 1.1fr 1.4fr 1fr; /* Evolución al doble de ancho, resto fluido */
        gap: 8px;
        align-items: stretch;
    }

    /* Altura igual para todos los bloques */
    .main-stats-grid .card-modern { 
        height: 600px; 
        display: flex; 
        flex-direction: column; 
    }

    .player-rank-item {
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        margin-top: 5px;
        white-space: nowrap; /* Prevent wrapping */
    }
    .player-rank-item.top { color: #15803d; }
    .player-rank-item.bottom { color: #b91c1c; }
    .player-rank-icon { font-size: 8px; }
    .player-rank-name { overflow: hidden; text-overflow: ellipsis; max-width: 90px; } /* Prevent long names from breaking layout */
    .player-rank-perc { font-size: 15px; font-weight: 900; }

    /* Full Ranking Table */
    .rank-grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .rank-item-card { background: #fdfdfd; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #f1f5f9; transition: 0.2s; }
    .rank-item-card:hover { border-color: #E31E24; background: #fff; box-shadow: 0 4px 12px rgba(227, 30, 36, 0.08); }
    
    .rank-table { width: 100%; border-collapse: collapse; }
    .rank-table td { padding: 6px; font-size: 14px; font-weight: 700; }
    
    .rank-avatar { width: 40px; height: 40px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; border: 2px solid #e2e8f0; }
    .rank-badge { font-size: 15px; font-weight: 900; padding: 5px 12px; border-radius: 30px; display: inline-block; }

    .badge-top { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .badge-bottom { background: #fee2e2; color: #b91c1c; border: 1px solid #fecdd3; }
    .badge-neutral { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

    .table-val { width: 100%; border-collapse: collapse; }
    .table-val th { text-align: left; font-size: 12px; color: #94a3b8; padding: 10px; text-transform: uppercase; }
    .table-val td { padding: 10px 4px; font-size: 16px; font-weight: 800; border-bottom: 1px solid #f8fafc; text-align: center; } /* Números más grandes */
    .table-val td:first-child { text-align: left; padding-left: 10px; }

    .month-rank-box { margin-bottom: 10px; padding: 8px; background: #f8fafc; border-radius: 12px; border: 1px solid #f1f5f9; }
    .month-rank-title { font-size: 16px; font-weight: 900; color: #E31E24; margin-bottom: 6px; border-bottom: 1px solid #eee; padding-bottom: 4px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .rank-mini-item {
        display: flex; align-items: center; gap: 6px; font-size: 16px; /* Números más grandes */
        font-weight: 700; margin-bottom: 2px; 
    }
    .rank-mini-item.top { color: #15803d; }
    .rank-mini-item.bottom { color: #b91c1c; }
    
    .scroll-v { overflow-y: auto; padding-right: 5px; }
    .scroll-v::-webkit-scrollbar { width: 4px; }
    .scroll-v::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

    /* Tooltip Profesional */
    [title] { position: relative; }
    .custom-tooltip { cursor: help; border-bottom: 1px dashed #ccc; }
    
    /* Compactar columnas de rendimiento */
    .col-compact { width: 60px; text-align: center; }
</style>

<div style="margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end;">
    <h1 style="font-weight: 900; color: #1e293b; text-transform: uppercase; letter-spacing: -1px; display: flex; align-items: center; gap: 15px;">
        <i class="fas fa-shield-halved" style="color: #E31E24;"></i> MI EQUIPO: <span style="color: #E31E24;">{{ equipo }}</span>
    </h1>
    <div style="font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Temporada 25-26</div>
</div>

<div class="mi-equipo-layout">
    <div class="main-stats-grid">
        <!-- Bloque 1: Gráfico -->
        <div class="card-modern">
            <div class="card-title"><i class="fas fa-chart-line"></i> EVOLUCIÓN ASISTENCIA</div>
            <div style="flex: 1; min-height: 0;">
                <canvas id="chartAsistencia"></canvas>
            </div>
        </div>

        <!-- Bloque 2: Rankings Mensuales -->
        <div class="card-modern">
            <div class="card-title" style="margin-bottom: 10px;"><i class="fas fa-calendar-alt"></i> ASISTENCIA MES</div>
            <div id="containerMonthlyRankings" class="scroll-v" style="flex: 1;"></div>
        </div>

        <!-- Bloque 3: Ranking Global (Multi-columna) -->
        <div class="card-modern">
            <div class="card-title" style="margin-bottom: 10px;"><i class="fas fa-trophy"></i> RANKING GLOBAL</div>
            <div class="scroll-v" style="flex: 1;">
                <div id="tbodyFullRanking" class="rank-grid-container"></div>
            </div>
        </div>

        <!-- Bloque 4: Rendimiento Flechas -->
        <div class="card-modern">
            <div class="card-title" style="margin-bottom: 10px;"><i class="fas fa-arrows-up-down"></i> RENDIMIENTO</div>
            <table class="table-val">
                <thead>
                    <tr>
                        <th>MES</th>
                        <th><i class="fas fa-arrow-up" style="color:#22c55e"></i> ARRIBA</th>
                        <th><i class="fas fa-arrow-right" style="color:#f59e0b"></i> NORMAL</th>
                        <th><i class="fas fa-arrow-down" style="color:#ef4444"></i> ABAJO</th>
                        <th style="text-align: center;"><i class="fas fa-bullhorn" style="color:#4f46e5;"></i></th>
                    </tr>
                </thead>
                <tbody id="tbodyValoracion"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let chartAsistencia = null;
    Chart.register(ChartDataLabels); // Register the datalabels plugin

    async function cargarStats() {
        const res = await fetch('/api/stats/mi-equipo');
        const data = await res.json();

        if (data.error) {
            console.error("Error en la API de estadísticas:", data.error);
            return;
        }

        allAsistenciaData = data.asistencia;
        renderChart(allAsistenciaData);
        renderValoracion(data.tabla_valoracion); // This function is still needed for the bottom-left card
        renderFullRanking(data.total_ranking); // New call
        renderMonthlyRankings(allAsistenciaData); // New call
    }

    function renderChart(asis) {
        const ctx = document.getElementById('chartAsistencia').getContext('2d');
        
        chartAsistencia = new Chart(ctx, {
            type: 'line',
            data: {
                labels: asis.labels,
                datasets: [
                    {
                        label: 'Media Asistencia %',
                        data: asis.media,
                        borderColor: '#E31E24',
                        backgroundColor: 'rgba(227, 30, 36, 0.05)',
                        borderWidth: 4,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#E31E24',
                        pointBorderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 9,
                        tension: 0.4,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false, // Removed legend as per request
                    },
                    datalabels: {
                        display: true,
                        align: 'top',
                        anchor: 'end',
                        offset: 5,
                        color: '#E31E24',
                        font: { weight: 'bold', size: 12 },
                        formatter: (val) => val + '%'
                    },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => asis.ratio[ctx.dataIndex]
                        }
                    }
                },
                scales: {
                    y: { beginAtZero: true, max: 100, ticks: { font: { weight: 'bold' } }, grid: { color: '#f1f5f9' } },
                    x: { grid: { display: false }, ticks: { font: { weight: 'bold' } } }
                } // Removed onClick handler as monthly ranking card is removed
            }
        });
    }

    function renderMonthlyRankings(asis) {
        const container = document.getElementById('containerMonthlyRankings');
        container.innerHTML = '';
        // Mapeamos los datos y los invertimos para que el mes más reciente (Junio) esté arriba
        const html = asis.labels.map((lbl, idx) => {
            const players = asis.monthly_player_rankings[idx];
            if (!players || players.length === 0) return '';
            
            // Copiamos y ordenamos para no afectar el original
            const sorted = [...players].sort((a, b) => b.perc - a.perc);
            const top2 = sorted.slice(0, 2);
            const bottom2 = sorted.length > 2 ? sorted.slice(-2).reverse() : [];
            
            return `
                <div class="month-rank-box">
                <div class="month-rank-title">${lbl}</div>
                <div style="margin-bottom: 6px;">
                    ${top2.map(p => `
                        <div class="rank-mini-item top">
                            <i class="fas fa-arrow-up"></i>
                            <span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${p.nombre}</span>
                            <span style="font-weight:900;">${p.perc}%</span>
                            </div>
                        `).join('')}
                    </div>
                    <div>
                        ${bottom2.map(p => `
                            <div class="rank-mini-item bottom">
                                <i class="fas fa-arrow-down"></i>
                                <span style="flex:1; overflow:hidden; text-overflow:ellipsis;">${p.nombre}</span>
                                <span style="font-weight:900;">${p.perc}%</span>
                            </div>
                        `).join('')}
                </div></div>
            `;
        }).reverse().join('');

        container.innerHTML = html;
        // Forzar scroll arriba para ver Junio y Mayo inmediatamente
        container.scrollTop = 0;
    }

    function renderFullRanking(ranking) {
        const tbody = document.getElementById('tbodyFullRanking');
        tbody.innerHTML = ranking.map((p, i) => {
            const badgeClass = i < 3 ? 'badge-top' : (i >= ranking.length - 3 ? 'badge-bottom' : 'badge-neutral');
            return `
                <div class="rank-item-card">
                    <div style="display:flex; align-items:center; gap:8px; min-width:0;">
                        <div class="rank-avatar" style="width:38px; height:38px; font-size:15px; color:${i<3?'#E31E24':'#666'}">#${i+1}</div>
                        <span style="font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${p.nombre}">${p.nombre.split(' ')[0]}</span>
                    </div>
                    <span style="font-size:18px; font-weight:900; color:${i<3?'#15803d':'#444'}">${p.perc}%</span>
                </div>
            `;
        }).join('');
    }

    function renderValoracion(tabla_valoracion) {
        const tbody = document.getElementById('tbodyValoracion');
        tbody.innerHTML = '';
        if (tabla_valoracion && tabla_valoracion.length > 0) {
            tabla_valoracion.forEach(row => {
                tbody.innerHTML += `
                    <tr>
                        <td>${row.mes}</td>
                        <td class="cell-perc" style="color:#22c55e;" title="${row.n_arriba} flechas">${row.arriba}%</td>
                        <td class="cell-perc" style="color:#f59e0b;" title="${row.n_medio} flechas">${row.medio}%</td>
                        <td class="cell-perc" style="color:#ef4444;" title="${row.n_abajo} flechas">${row.abajo}%</td>
                        <td class="charlas-col">${row.charlas}</td>
                    </tr>
                `;
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px; color: #999;">No hay datos de valoración.</td></tr>';
        }
    }

    window.onload = cargarStats;
</script>
{% endblock %}
