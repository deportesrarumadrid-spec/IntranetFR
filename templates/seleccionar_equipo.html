<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seleccionar Equipo - Intranet Club</title>
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #e60000; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; font-size: 1.2rem; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 25px; font-weight: 600; }
        select { width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #eee; border-radius: 10px; font-size: 15px; font-weight: 700; outline: none; transition: 0.3s; background: #fdfdfd; }
        select:focus { border-color: #e60000; }
        button { width: 100%; background: #e60000; color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #cc0000; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(230, 0, 0, 0.3); }
    </style>
</head>
<body>
    <div class="box">
        <img src="{{ url_for('static', filename='ESCUDO SIN FONDO.png') }}" alt="Escudo" style="width: 120px; margin-bottom: 15px;">
        <h2>HOLA, {{ usuario }}</h2>
        <p>Por favor, selecciona el equipo con el que vas a trabajar hoy:</p>
        
        <form action="/seleccionar_equipo" method="POST">
            <select name="equipo" required>
                <option value="" disabled selected>ELEGIR EQUIPO...</option>
                {% for eq in equipos %}
                <option value="{{ eq }}">{{ eq }}</option>
                {% endfor %}
            </select>
            <button type="submit">ACCEDER AL PANEL</button>
        </form>
    </div>
</body>
</html>
