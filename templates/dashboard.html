<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Intranet Club - Panel Principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "3fb3580a-20d1-4c62-b850-a88c47a80dec", // <-- ID de OneSignal proporcionado
          allowLocalhostAsSecureOrigin: true, // Para poder probarlo en local si es necesario
        });

        OneSignal.Notifications.addEventListener("permissionChange", async (permission) => {
            if (permission) {
                const usuario = "{{ usuario }}";
                if (usuario && usuario !== 'Invitado') {
                    const idNormalizado = usuario.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    console.log("OneSignal: Vinculando usuario como", idNormalizado);
                    await OneSignal.login(idNormalizado);
                }
            }
        });

        if (!OneSignal.Notifications.permission) {
            await OneSignal.Notifications.requestPermission();
        }
      });
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; display: flex; height: 100vh; background-color: #f4f7f6; overflow: hidden; }

.sidebar {
    width: 260px !important;
    min-width: 260px !important;
    max-width: 260px !important;
    flex: 0 0 260px !important; /* ESTO es lo que impide que se mueva */
    background-color: #E31E24;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
    flex-shrink: 0 !important;
}

.main-content {
    flex: 1 1 auto !important; /* Esto obliga a la parte blanca a ocupar el resto */
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
    background-color: #f4f7f6;
}

.menu-item.active {
    background-color: white !important;
    color: #E31E24 !important;
    border-radius: 10px 0 0 10px !important; 
    margin-left: 15px !important;
    width: calc(100% - 15px) !important; /* Para que el botón blanco no empuje la barra */
    border-left: none !important;
    font-weight: 900;
}

        .sidebar {
    width: 260px !important;
    min-width: 260px !important;
    max-width: 260px !important;
    background-color: #E31E24;
    color: white;
    display: flex;
    flex-direction: column;
    height: 100vh;
    flex-shrink: 0; /* Esto impide que el contenido de la derecha lo empuje */
}

        .logo-area {
    padding: 30px 25px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 1.2rem;
    text-align: left; /* Alineado igual que en la foto 1 */
}

        .menu-container { padding-top: 20px; flex-grow: 1; }

        .menu-item {
            padding: 15px 25px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .menu-item.active {
    background-color: white !important;
    color: #E31E24 !important;
    border-radius: 10px 0 0 10px !important; 
    margin-left: 15px !important; /* Reducimos de 20 a 15 para que no se vea tan estrecho el botón */
    border-left: none !important;
}

        .menu-item:hover { color: white; background-color: rgba(0,0,0,0.1); }

        /* Caja de Avisos en el Sidebar */
        .avisos-sidebar {
            background: white;
            margin: 20px;
            padding: 15px;
            border-radius: 12px;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none; /* Se muestra solo si hay pendientes */
        }
        .avisos-sidebar h4 {
            color: #E31E24;
            font-size: 0.7rem;
            margin-bottom: 12px;
            font-family: 'Archivo Black', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 8px;
            text-transform: uppercase;
        }
        .aviso-item {
            font-size: 0.7rem;
            font-weight: 700;
            color: #555;
            padding: 6px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .aviso-item i { color: #E31E24; width: 12px; text-align: center; }

        .tareas-box {
            background: white;
            margin: 20px;
            padding: 15px;
            border-radius: 12px;
            color: #333;
        }
        .tareas-box h4 { color: #E31E24; font-size: 0.7rem; margin-bottom: 5px; font-family: 'Archivo Black'; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .top-bar {
            background: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .btn-salir { 
            color: #E31E24; 
            text-decoration: none; 
            font-size: 0.75rem;
            padding: 8px 15px;
            border: 2px solid #E31E24;
            border-radius: 6px;
            font-weight: 900;
        }

        .render-area { flex: 1; padding: 25px; overflow-y: auto; background-color: #f4f7f6; }

        /* Pantalla de Carga Global */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(244, 247, 246, 0.6); /* Fondo semi-transparente */
            backdrop-filter: blur(4px); /* Efecto difuminado reducido */
            -webkit-backdrop-filter: blur(4px); /* Soporte para navegadores basados en Safari/iOS */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        .loader-container { position: relative; display: flex; align-items: center; justify-content: center; width: 150px; height: 150px; }
        .loader-escudo { width: 80px; height: auto; z-index: 10; filter: drop-shadow(0 0 10px rgba(0,0,0,0.1)); }
        .loader-spinner {
            position: absolute;
            width: 130px;
            height: 130px;
            border: 4px solid rgba(227, 30, 36, 0.1); /* Rojo muy tenue */
            border-top: 4px solid #E31E24; /* Rojo principal */
            border-radius: 50%;
            animation: spin-loader 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }
        @keyframes spin-loader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>
<body>
    <!-- Pantalla de Carga -->
    <div id="loader-wrapper">
        <div class="loader-container">
            <div class="loader-spinner"></div>
            <img src="{{ url_for('static', filename='ESCUDO SIN FONDO.png') }}" class="loader-escudo" alt="Cargando...">
        </div>
    </div>

    <div class="sidebar">
    <div class="logo-area">INTRANET FR</div>
    
    <div class="menu-container">
<a href="/deportivo" class="menu-item {{ 'active' if 'deportivo' in request.path }}">ENTRENAMIENTOS</a>
<a href="/asistencias" class="menu-item {{ 'active' if 'asistencias' in request.path }}">ASISTENCIAS</a>
<a href="/financiero" class="menu-item {{ 'active' if 'financiero' in request.path }}">FINANCIERO</a>
<a href="/direccion_deportiva" class="menu-item {{ 'active' if 'direccion_deportiva' in request.path }}">D. DEPORTIVA</a>
    </div>

    <div id="sidebarAvisos" class="avisos-sidebar">
        <div id="seccionAsis" style="display: none;">
            <h4><i class="fas fa-calendar-times"></i> Asistencias</h4>
            <div id="listaAsis"></div>
        </div>
        <div id="seccionVals" style="display: none; margin-top: 15px; border-top: 1px solid #f4f7f6; padding-top: 10px;">
            <h4><i class="fas fa-arrow-up"></i> Valoraciones</h4>
            <div id="listaVals"></div>
        </div>
    </div>
</div>

        
    </div>

    <div class="main-content">
        <div class="top-bar">
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="{{ url_for('static', filename='ESCUDO SIN FONDO.png') }}" alt="Escudo" style="height: 65px; width: auto;">
                <span style="font-size: 0.9rem; color: #666;">Bienvenido, <strong id="userId" style="color: #333;">{{ usuario }}</strong></span>
            </div>
            <a href="/" class="btn-salir">CERRAR SESIÓN</a>
        </div>

        <div class="render-area">
            {% block content %}
            <!-- Esto se sobreescribirá -->
            {% endblock %}
        </div>
    </div>

    <script>
        // Función global para ocultar el cargador
        function showLoader() {
            const loader = document.getElementById('loader-wrapper');
            if (loader) {
                loader.classList.remove('loader-hidden');
            }
        }

        function hideLoader() {
            const loader = document.getElementById('loader-wrapper');
            if (loader && !loader.classList.contains('loader-hidden')) {
                setTimeout(() => { loader.classList.add('loader-hidden'); }, 400);
            }
        }

        // Fallback de seguridad: Si en 10 segundos no se ha ocultado (por error en datos), lo quitamos
        window.addEventListener('load', function() {
            setTimeout(() => {
                hideLoader();
            }, 10000);
        });
    </script>
</body>
</html>
