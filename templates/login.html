<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intranet Club</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Intranet CF">
    <link rel="apple-touch-icon" href="/static/app-icon.png">
    <style>
        /* Fondo con degradado sutil y centrado total */
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
        }

        /* Tarjeta de login moderna */
        .login-box { 
            background: #ffffff; 
            padding: 50px 40px; 
            border-radius: 20px; /* Bordes más redondeados y modernos */
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); /* Sombra más profunda y suave */
            border: 1px solid rgba(255,255,255,0.3); 
            width: 320px; 
            text-align: center; 
        }

        /* Título con más personalidad */
        h2 {
            color: #e60000;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        /* Inputs limpios y profesionales */
        input { 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            background: #fdfdfd; 
            border: 2px solid #eee; 
            color: #333; 
            box-sizing: border-box; 
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        /* Efecto al hacer clic en los campos */
        input:focus {
            border-color: #e60000;
            background: #fff;
        }

        /* Botón rojo identidad del club con efectos */
        button { 
            width: 100%; 
            background: #e60000; 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        button:hover { 
            background: #cc0000; 
            transform: translateY(-2px); /* Pequeño salto al pasar el ratón */
            box-shadow: 0 5px 15px rgba(230, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .version-pill {
            display: inline-flex;
            background: #1565c0;
            border-radius: 30px;
            padding: 4px;
            cursor: pointer;
            user-select: none;
            transition: background 0.25s;
            margin-bottom: 8px;
        }
        .version-pill.is-movil { background: #2e7d32; }
        .vp-opt {
            padding: 9px 20px;
            border-radius: 26px;
            font-size: 13px;
            font-weight: 800;
            color: rgba(255,255,255,0.55);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .vp-opt.active { background: white; color: #1e293b; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="{{ url_for('static', filename='ESCUDO SIN FONDO.png') }}" alt="Escudo" style="width: 180px; margin-bottom: 20px;">
        
        <h2>INTRANET CLUB</h2>

        <form action="/login" method="POST">
            <input type="text" name="usuario" placeholder="Usuario" required>
            <div style="position:relative;">
                <input type="password" name="password" id="passwordInput" placeholder="Contraseña" required style="padding-right:42px;">
                <span onclick="togglePwd()" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; color:#aaa; font-size:18px; user-select:none;">👁</span>
            </div>
            {% if error %}
            <div style="color: #e60000; font-size: 12px; font-weight: 800; margin-bottom: 15px; background: #ffebeb; padding: 10px; border-radius: 8px; border: 1px solid #ffcccc;">{{ error }}</div>
            {% endif %}

            <div style="margin:18px 0 10px; text-align:center;">
                <div id="versionPill" onclick="toggleVersion()" style="display:inline-flex; background:#e60000; border-radius:30px; padding:4px; cursor:pointer; user-select:none; transition:background 0.25s;">
                    <span id="optWeb"   style="display:inline-block; padding:9px 22px; border-radius:26px; font-size:12px; font-weight:900; background:white; color:#1e293b; white-space:nowrap; letter-spacing:1px;">WEB</span>
                    <span id="optMovil" style="display:inline-block; padding:9px 22px; border-radius:26px; font-size:12px; font-weight:900; color:rgba(255,255,255,0.75); white-space:nowrap; letter-spacing:1px;">MÓVIL</span>
                </div>
                <input type="hidden" name="version" id="versionInput" value="WEB">
            </div>

            <button type="button" id="btnAcceder" onclick="acceder()">ACCEDER</button>
        </form>
    </div>
    <script>
        function togglePwd() {
            const inp = document.getElementById('passwordInput');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }
        function toggleVersion() {
            const pill = document.getElementById('versionPill');
            const web = document.getElementById('optWeb');
            const mov = document.getElementById('optMovil');
            const input = document.getElementById('versionInput');
            const isMovil = input.value === 'MOVIL';
            if (isMovil) {
                input.value = 'WEB';
                pill.style.background = '#e60000';
                web.style.background = 'white'; web.style.color = '#1e293b';
                mov.style.background = 'transparent'; mov.style.color = 'rgba(255,255,255,0.7)';
            } else {
                input.value = 'MOVIL';
                pill.style.background = '#e60000';
                mov.style.background = 'white'; mov.style.color = '#1e293b';
                web.style.background = 'transparent'; web.style.color = 'rgba(255,255,255,0.7)';
            }
        }
        function acceder() {
            if (document.activeElement) document.activeElement.blur();
            const btn = document.getElementById('btnAcceder');
            const form = document.querySelector('form');
            if (!form.checkValidity()) { form.reportValidity(); return; }
            // Guardar para la próxima vez
            try {
                localStorage.setItem('login_usuario',  document.querySelector('input[name="usuario"]').value);
                localStorage.setItem('login_password', document.querySelector('input[name="password"]').value);
                localStorage.setItem('login_version',  document.getElementById('versionInput').value);
            } catch(e) {}
            btn.disabled = true;
            btn.style.opacity = '0.7';
            btn.innerHTML = 'ACCEDIENDO...';
            form.submit();
        }
        // Pre-rellenar con la última sesión guardada
        window.addEventListener('DOMContentLoaded', () => {
            try {
                const u = localStorage.getItem('login_usuario');
                const p = localStorage.getItem('login_password');
                const v = localStorage.getItem('login_version');
                if (u) document.querySelector('input[name="usuario"]').value = u;
                if (p) document.querySelector('input[name="password"]').value = p;
                if (v === 'MOVIL' && document.getElementById('versionInput').value !== 'MOVIL') toggleVersion();
            } catch(e) {}
        });
    </script>
</body>
</html>
